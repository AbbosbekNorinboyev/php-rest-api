<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Create Task</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div>
    <h2>Yangi Task</h2>

    <form id="taskForm">
        <input
                type="text"
                id="title"
                placeholder="Task title"
                required
        >
        <br><br>

        <textarea
                id="description"
                placeholder="Description"
        ></textarea>
        <br><br>

        <button type="submit">Create Task</button>
    </form>

    <pre id="result"></pre>

</div>

<script src="js/app.js"></script>

</body>
</html>
